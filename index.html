    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        function isNoise(msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          return (
            str.indexOf('cannot listen to the event from the provided iframe') !== -1 ||
            str.indexOf('contentwindow is not available') !== -1 ||
            str.indexOf('speechsynthesis') !== -1 ||
            str.indexOf('speech synthesis') !== -1 ||
            str === 'script error.' ||
            str.indexOf('script error.') !== -1
          );
        }

        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && (event.error.message || event.error.stack)) || '';
          if (isNoise(msg)) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack)) || String(reason || '');
          if (isNoise(msg)) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
