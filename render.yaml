services:
  - type: web
    name: trading-journal
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: SITE_PASSWORD
        sync: false
      # Site erişim jetonlarını imzalar; parola değişse de ayrı tutulur (Render otomatik üretir)
      - key: TOKEN_SECRET
        generateValue: true
