services:
  - type: web
    name: trading-journal
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: SITE_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
